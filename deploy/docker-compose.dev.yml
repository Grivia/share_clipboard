services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fastcopy
      POSTGRES_PASSWORD: fastcopy-dev
      POSTGRES_DB: fastcopy
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastcopy -d fastcopy"]
      interval: 2s
      timeout: 2s
      retries: 20

  server:
    build:
      context: ../server
    environment:
      FASTCOPY_LISTEN_ADDR: ":8083"
      FASTCOPY_DATABASE_URL: "postgres://fastcopy:fastcopy-dev@postgres:5432/fastcopy?sslmode=disable"
      FASTCOPY_PUBLIC_BASE_URL: "http://localhost:8083"
      FASTCOPY_REGISTRATION_ENABLED: "true"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
